name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.3.0)
        required: true

permissions:
  contents: read

jobs:
  # Gate: the tag must match the manifest version and point at promoted code.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Verify tag, version and reachability
        id: check
        env:
          REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${REF#refs/tags/}"
          VERSION=$(bun --eval 'console.log(require("./manifest.json").version)')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match manifest version v$VERSION"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAG^{commit}" origin/main; then
            echo "::error::tag $TAG is not reachable from origin/main"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck and test
        run: |
          bun run typecheck
          bun test

  # Build the store zip and attach it to the GitHub release.
  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Package
        run: bun run package
      - name: Zip
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cd dist && zip -rq "../specio-${VERSION}.zip" . -x '.*'
      - name: Upload artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: extension-zip
          path: specio-*.zip
          retention-days: 7
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Releases are immutable, so the asset must be attached at creation —
          # a later upload is rejected. Create the release with the zip in one
          # shot; if it already exists (a re-run), leave it untouched.
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; leaving it untouched."
          else
            gh release create "v${VERSION}" --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --generate-notes "specio-${VERSION}.zip"
          fi

  # Publish to the Chrome Web Store. Skipped (with a notice) when the store
  # secrets are not configured, so the GitHub release still ships.
  publish:
    name: Publish to Chrome Web Store
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download the zip
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: extension-zip
      - name: Upload and publish
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${EXTENSION_ID}" ] || [ -z "${CLIENT_ID}" ] || [ -z "${CLIENT_SECRET}" ] || [ -z "${REFRESH_TOKEN}" ]; then
            echo "::notice::Chrome Web Store secrets not set — skipping store publish (the GitHub release still shipped). Set CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET and CWS_REFRESH_TOKEN to enable it."
            exit 0
          fi

          # Read one JSON field from stdin, buffering the whole body first (the
          # response can arrive in several chunks).
          json_field() { bun -e "const t=await Bun.stdin.text(); try{process.stdout.write(String(JSON.parse(t).$1??''))}catch{process.stdout.write('')}"; }

          # Exchange the refresh token for a short-lived access token.
          ACCESS_TOKEN=$(curl -sf -X POST "https://oauth2.googleapis.com/token" \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "refresh_token=${REFRESH_TOKEN}" \
            -d "grant_type=refresh_token" | json_field access_token)
          if [ -z "${ACCESS_TOKEN}" ]; then
            echo "::error::failed to obtain a Chrome Web Store access token"
            exit 1
          fi

          # Upload the new package.
          STATE=$(curl -sf \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -X PUT -T "specio-${VERSION}.zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXTENSION_ID}" | json_field uploadState)
          if [ "${STATE}" != "SUCCESS" ]; then
            echo "::error::upload did not succeed (state: ${STATE:-unknown})"
            exit 1
          fi

          # Publish to the default (public) track.
          STATUS=$(curl -sf \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}/publish" | json_field 'status[0]')
          case "${STATUS}" in
            OK | ITEM_PENDING_REVIEW)
              echo "::notice::Published specio ${VERSION} to the Chrome Web Store (status: ${STATUS}).";;
            *)
              echo "::error::Chrome Web Store publish returned status: ${STATUS:-unknown}"
              exit 1;;
          esac
